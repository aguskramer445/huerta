<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Huerta Monitor</title>
</head>
<body>
  <header>
    <h1>Monitor de Huerta - Agustin Kramer</h1>
  </header>

  <section class="panel">
    <div class="row">
      <h2>Temperatura:</h2>
      <span id="tempValue">-- °C</span>
    </div>

    <div class="row">
      <h3>Humedad Aire:</h3>
      <span id="humedadValue">-- %</span>
    </div>

    <div class="row">
      <h4>Humedad Suelo:</h4>
      <span id="sueloValue">-- %</span>
    </div>
  </section>

  <script type="module" src="java.js"></script>
</body>
</html>
